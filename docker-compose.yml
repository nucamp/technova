version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: technova-db
    environment:
      POSTGRES_USER: technova_admin
      POSTGRES_PASSWORD: TechN0va2024!  # Intentionally weak password
      POSTGRES_DB: technova_health
    ports:
      - "5434:5432"  # Using 5434 externally to avoid conflict with system PostgreSQL
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
      - shared-logs:/var/log/shared
    networks:
      - technova-network
    command: sh -c 'docker-entrypoint.sh postgres -c log_statement=all 2>&1 | tee /var/log/shared/postgres.log'

  # Redis Cache
  redis:
    image: redis:6-alpine
    container_name: technova-redis
    ports:
      - "6379:6379"
    networks:
      - technova-network
    volumes:
      - shared-logs:/var/log/shared
    command: sh -c 'redis-server --requirepass "redis123" --loglevel verbose | tee /var/log/shared/redis.log'

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: technova-minio
    entrypoint: /bin/sh
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin  # Intentionally weak password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - shared-logs:/var/log/shared
    networks:
      - technova-network
    command: -c 'minio server /data --console-address ":9001" 2>&1 | tee /var/log/shared/minio.log'

  # Backend API
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: technova-backend
    environment:
      DATABASE_URL: postgresql://technova_admin:TechN0va2024!@postgres:5432/technova_health
      REDIS_URL: redis://:redis123@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: super_secret_key_123  # Intentionally weak secret
      NODE_ENV: development
    ports:
      - "3001:3001"
      - "22:22"
    volumes:
      - shared-logs:/var/log/shared # Add shared volume to backend
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - technova-network

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: technova-frontend
    environment:
      - WDS_SOCKET_PORT=0
    # No need for REACT_APP_API_URL - frontend detects port and adjusts
    ports:
      - "3000:3000"  # Direct access (bypass WAF) - for teaching
    volumes:
      - shared-logs:/var/log/shared # Add shared volume to frontend
    depends_on:
      - backend
    networks:
      - technova-network

  # Web Application Firewall (Coraza + Caddy)
  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    container_name: technova-waf
    ports:
      - "80:80"     # Main access/ point (through WAF)
      - "8080:80"   # Alternative port
    volumes:
      - shared-logs:/var/log/shared
    depends_on:
      - frontend
      - backend
    networks:
      - technova-network

  # OpenObserve (Log Visualization)
  openobserve:
    build:
      context: ./observibility/openobserve
      dockerfile: Dockerfile
    container_name: technova-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: "root@example.com"
      ZO_ROOT_USER_PASSWORD: "Complexpass#123"
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - openobserve-data:/data
    networks:
      - technova-network

  # Flicker (Log Collector)
  flicker:
    build:
      context: ./observibility/flicker
      dockerfile: Dockerfile
    container_name: technova-flicker
    volumes:
      - shared-logs:/var/log/shared
    depends_on:
      - openobserve
    networks:
      - technova-network

  # Greenbone Vulnerability Scanner
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - vt_data_vol:/mnt
    networks:
      - technova-network
    profiles:
      - openvas

  notus-data:
    image: registry.community.greenbone.net/community/notus-data
    volumes:
      - notus_data_vol:/mnt
    networks:
      - technova-network
    profiles:
      - openvas

  scap-data:
    image: registry.community.greenbone.net/community/scap-data
    volumes:
      - scap_data_vol:/mnt
    networks:
      - technova-network
    profiles:
      - openvas

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data
    volumes:
      - cert_data_vol:/mnt
    networks:
      - technova-network
    profiles:
      - openvas

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      - cert-bund-data
    networks:
      - technova-network
    profiles:
      - openvas

  data-objects:
    image: registry.community.greenbone.net/community/data-objects
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - data_objects_vol:/mnt
    networks:
      - technova-network
    profiles:
      - openvas

  report-formats:
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      - data-objects
    networks:
      - technova-network
    profiles:
      - openvas

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt
    networks:
      - technova-network
    profiles:
      - openvas

  redis-server:
    image: registry.community.greenbone.net/community/redis-server
    restart: on-failure
    volumes:
      - redis_socket_vol:/run/redis/ 
    networks:
      - technova-network
    profiles:
      - openvas

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable
    restart: on-failure
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
    networks:
      - technova-network
    profiles:
      - openvas

  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable
    restart: on-failure
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_completed_successfully
      cert-bund-data:
        condition: service_completed_successfully
      dfn-cert-data:
        condition: service_completed_successfully
      data-objects:
        condition: service_completed_successfully
      report-formats:
        condition: service_completed_successfully
    networks:
      - technova-network
    profiles:
      - openvas

  gsa:
    image: registry.community.greenbone.net/community/gsa:stable
    restart: on-failure
    ports:
      - "9392:80"
    volumes:
      - gvmd_socket_vol:/run/gvmd
    depends_on:
      - gvmd
    networks:
      - technova-network
    profiles:
      - openvas

  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    networks:
      - technova-network
    profiles:
      - openvas

  openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    restart: on-failure
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully
    networks:
      - technova-network
    profiles:
      - openvas

  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    restart: on-failure
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - openvasd
      technova-network:
        aliases:
          - openvasd
    profiles:
      - openvas

  ospd-openvas:
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    restart: on-failure
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/ 
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
    networks:
      - technova-network
    profiles:
      - openvas

  gvm-tools:
    image: registry.community.greenbone.net/community/gvm-tools
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
    depends_on:
      - gvmd
      - ospd-openvas
    networks:
      - technova-network
    profiles:
      - openvas

volumes:
  postgres-data:
  minio-data:
  shared-logs: # Define the new shared volume
  openobserve-data: # Persistent data for OpenObserve
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:

networks:
  technova-network:
    driver: bridge
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: technova-db
    environment:
      POSTGRES_USER: technova_admin
      POSTGRES_PASSWORD: TechN0va2024!  # Intentionally weak password
      POSTGRES_DB: technova_health
    ports:
      - "5433:5432"  # Using 5433 externally to avoid conflict with system PostgreSQL
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
      - shared-logs:/var/log/shared
    networks:
      - technova-network
    command: sh -c 'docker-entrypoint.sh postgres -c log_statement=all 2>&1 | tee /var/log/shared/postgres.log'

  # Redis Cache
  redis:
    image: redis:6-alpine
    container_name: technova-redis
    ports:
      - "6379:6379"
    networks:
      - technova-network
    volumes:
      - shared-logs:/var/log/shared
    command: sh -c 'redis-server --requirepass "redis123" --loglevel verbose | tee /var/log/shared/redis.log'

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: technova-minio
    entrypoint: /bin/sh
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin  # Intentionally weak password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - shared-logs:/var/log/shared
    networks:
      - technova-network
    command: -c 'minio server /data --console-address ":9001" 2>&1 | tee /var/log/shared/minio.log'

  # Backend API
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: technova-backend
    environment:
      DATABASE_URL: postgresql://technova_admin:TechN0va2024!@postgres:5432/technova_health
      REDIS_URL: redis://:redis123@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: super_secret_key_123  # Intentionally weak secret
      NODE_ENV: development
    ports:
      - "3001:3001"
      - "2222:22"  # SSH access
    volumes:
      - shared-logs:/var/log/shared # Add shared volume to backend
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - technova-network

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: technova-frontend
    environment:
      - WDS_SOCKET_PORT=0
    # No need for REACT_APP_API_URL - frontend detects port and adjusts
    ports:
      - "3000:3000"  # Direct access (bypass WAF) - for teaching
    volumes:
      - shared-logs:/var/log/shared # Add shared volume to frontend
    depends_on:
      - backend
    networks:
      - technova-network

  # Web Application Firewall (Coraza + Caddy)
  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    container_name: technova-waf
    ports:
      - "80:80"     # Main access point (through WAF)
      - "8080:80"   # Alternative port
    volumes:
      - shared-logs:/var/log/shared
    depends_on:
      - frontend
      - backend
    networks:
      - technova-network

  # OpenObserve (Log Visualization)
  openobserve:
    build:
      context: ./observibility/openobserve
      dockerfile: Dockerfile
    container_name: technova-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: "root@example.com"
      ZO_ROOT_USER_PASSWORD: "Complexpass#123"
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - openobserve-data:/data
    networks:
      - technova-network

  # Flicker (Log Collector)
  flicker:
    build:
      context: ./observibility/flicker
      dockerfile: Dockerfile
    container_name: technova-flicker
    volumes:
      - shared-logs:/var/log/shared
    depends_on:
      - openobserve
    networks:
      - technova-network

volumes:
  postgres-data:
  minio-data:
  shared-logs: # Define the new shared volume
  openobserve-data: # Persistent data for OpenObserve

networks:
  technova-network:
    driver: bridge

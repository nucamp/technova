version: '3.8'

services:
  waf:
    build: .
    ports:
      - "80:80"
    volumes:
      - shared-logs:/var/log/shared
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - shared-logs:/var/log/shared

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - shared-logs:/var/log/shared

volumes:
  shared-logs:
